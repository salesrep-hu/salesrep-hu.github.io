<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salesrep – ajánlat</title>
<meta name="description" content="A személyre szabott ajánlatod – a darabszámokat módosíthatod, és innen meg is rendelheted.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Salesrep Kft.">
<meta property="og:title" content="Salesrep – ajánlat">
<meta property="og:description" content="A személyre szabott ajánlatod – a darabszámokat módosíthatod, és innen meg is rendelheted.">
<meta property="og:image" content="https://salesrep.hu/wp-content/uploads/2023/09/cropped-Logo-by-Laci-black.png">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://salesrep.hu/wp-content/uploads/2023/09/salesrep-logo-favicon-64x64.webp">
<style>
  html, body { margin:0; height:100%; background:#f6f7f7; color:#1c2b2a; font-family:-apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; display:block; }
  .tolt { font-size:16px; color:#6b7774; text-align:center; padding-top:40vh; }
  #m { display:none; max-width:520px; margin:0 auto; padding:16px; }
  #m img { height:34px; width:auto; display:block; }
  #m h2 { margin:10px 0 4px; font-size:19px; }
  .kis { color:#6b7774; font-size:14px; }
  .szoveg { background:#fff; border:1px solid #e3e6e5; border-radius:12px; padding:12px; margin-top:12px; font-size:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .g { display:block; width:100%; box-sizing:border-box; text-align:center; text-decoration:none; font-size:17px; font-weight:600; padding:14px; border-radius:12px; margin-top:10px; border:0; font-family:inherit; cursor:pointer; }
  .piros { background:#e8000b; color:#fff; } .viber { background:#7360f2; color:#fff; } .wa { background:#25d366; color:#fff; }
  .feher { background:#fff; color:#1c2b2a; border:1px solid #e3e6e5; }
  #uz { text-align:center; color:#1e7b45; font-size:14px; margin-top:10px; min-height:18px; }
  .hiba { color:#e8000b; }
</style>
</head>
<body>
<div class="tolt" id="tolt">Az ajánlat betöltése…</div>

<!-- Zoli „Link küldése” oldala (?m=1): saját oldal, így a vágólap és a megosztás menü is működik -->
<div id="m">
  <img src="https://salesrep.hu/wp-content/uploads/2023/09/cropped-Logo-by-Laci-black.png" alt="Salesrep Kft.">
  <h2>Ajánlat küldése a partnernek</h2>
  <div class="kis" id="uzlet"></div>
  <div class="szoveg" id="szoveg"></div>
  <button class="g piros" id="oszt">Küldés… (megosztás menü)</button>
  <a class="g viber" id="viber" href="#">Viber</a>
  <a class="g wa" id="wa" href="#" target="_blank" rel="noopener">WhatsApp</a>
  <a class="g feher" id="sms" href="#">SMS</a>
  <button class="g feher" id="masol">Szöveg másolása</button>
  <div id="uz"></div>
  <p class="kis" style="font-size:12px;margin-top:16px">Ez az oldal csak neked szól – a partner a fenti linket kapja. Megnyitása nem számít a partner megnyitásának.</p>
</div>

<script>
  // Salesrep online ajánlat – a Google Apps Script webalkalmazás (Google-sáv nélkül, rövid linkkel).
  var APP = 'https://script.google.com/macros/s/AKfycbxxh_NyBiZ4NemFJVn84S2dcMHJI7Qmnz5inN33eFEfDci-bw43T4Xx8d9-KvO5QFP-/exec';
  var p = new URLSearchParams(location.search);
  var t = (p.get('t') || location.hash.slice(1) || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 40);   // rövid link: salesrep-hu.github.io/#TOKEN

  if (p.get('m') === '1') {
    // Zoli megosztó oldala: az adatokat JSON-ban kéri (?m=j), a gombok itt, a saját oldalon futnak
    document.title = 'Ajánlat küldése';
    var uz = document.getElementById('uz');
    fetch(APP + '?m=j&t=' + encodeURIComponent(t)).then(function (r) { return r.json(); }).then(function (d) {
      document.getElementById('tolt').style.display = 'none';
      document.getElementById('m').style.display = 'block';
      if (d.hiba) { document.getElementById('szoveg').innerHTML = '<span class="hiba"></span>'; document.querySelector('#szoveg .hiba').textContent = d.hiba; return; }
      document.getElementById('uzlet').textContent = d.uzlet || '';
      // v4 (2026-11-07): a küldés gombjai jelzik a kiküldést (az Üzenőfal ebből zárja le a feladatot)
      function naplo(c) { try { fetch(APP + '?m=k&t=' + encodeURIComponent(t) + '&csat=' + encodeURIComponent(c), { mode: 'no-cors', keepalive: true }); } catch (e) {} }
      ['viber', 'wa', 'sms'].forEach(function (id) { document.getElementById(id).addEventListener('click', function () { naplo(id === 'wa' ? 'WhatsApp' : id === 'sms' ? 'SMS' : 'Viber'); }); });
      document.getElementById('szoveg').textContent = d.szoveg;
      var enc = encodeURIComponent(d.szoveg);
      document.getElementById('viber').href = 'viber://forward?text=' + encodeURIComponent(d.viber);   // a Viber legfeljebb 200 karaktert ad át
      document.getElementById('wa').href = 'https://wa.me/?text=' + enc;
      document.getElementById('sms').href = 'sms:?&body=' + enc;
      document.getElementById('oszt').onclick = function () {
        naplo('Megosztás');
        if (navigator.share) navigator.share({ text: d.szoveg }).catch(function () {});
        else uz.textContent = 'Ezen az eszközön nincs megosztás menü – használd a lenti gombokat.';
      };
      function regiMasolas() {   // tartalék: rejtett szövegmező + execCommand('copy')
        var ta = document.createElement('textarea'); ta.value = d.szoveg; ta.setAttribute('readonly', '');
        ta.style.position = 'fixed'; ta.style.top = '-1000px'; document.body.appendChild(ta);
        ta.select(); ta.setSelectionRange(0, ta.value.length);
        var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        uz.textContent = ok ? 'Kimásolva – illeszd be az üzenetbe.' : 'Nem sikerült – jelöld ki a szöveget kézzel.';
      }
      document.getElementById('masol').onclick = function () {
        naplo('Másolás');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(d.szoveg).then(function () { uz.textContent = 'Kimásolva – illeszd be az üzenetbe.'; }, regiMasolas);
        } else regiMasolas();
      };
    }).catch(function () {
      document.getElementById('tolt').textContent = 'Nem sikerült betölteni. Próbáld újra pár másodperc múlva.';
    });
  } else {
    // A partner ajánlat-oldala: a webalkalmazás beágyazva
    var f = document.createElement('iframe');
    f.title = 'Salesrep – ajánlat';
    f.setAttribute('allow', 'clipboard-write; web-share');
    f.src = APP + '?t=' + encodeURIComponent(t);
    document.body.appendChild(f);
  }
</script>
</body>
</html>
